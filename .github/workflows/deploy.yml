name: Build and deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          # Repo variable STAGING = 1 while building for get-to-revenue.com (noindex + robots disallow).
          # Set it to 0 (or delete it) at launch.
          NEXT_PUBLIC_STAGING: ${{ vars.STAGING }}
      - name: Upload out/ to Hostinger over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}   # for example /domains/get-to-revenue.com/public_html/
          local-dir: ./out/
